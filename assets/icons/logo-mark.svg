<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gugauli Organic Producer Company">
  <!-- Compact badge mark: sunrise + seedling in a circular frame.
       Used in the site header and favicon. For the full badge with
       ring lettering see logo-full.svg. -->
  <circle cx="32" cy="32" r="31" fill="#F7F4EC"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#245C36" stroke-width="2"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#5C9A4F" stroke-width="1.25" opacity=".55"/>

  <!-- rising sun -->
  <circle cx="32" cy="30" r="8" fill="#E0A12E"/>
  <g stroke="#E0A12E" stroke-width="2.4" stroke-linecap="round">
    <line x1="32" y1="13" x2="32" y2="18"/>
    <line x1="20.2" y1="18.2" x2="23.7" y2="21.7"/>
    <line x1="43.8" y1="18.2" x2="40.3" y2="21.7"/>
    <line x1="15" y1="30" x2="20" y2="30"/>
    <line x1="49" y1="30" x2="44" y2="30"/>
  </g>

  <!-- seedling over the sun -->
  <path d="M32 44V31" stroke="#245C36" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M32 34C26.5 34 22 30.6 21 25.5c5.6-.4 10 2.7 11 8.5Z" fill="#245C36"/>
  <path d="M32 34c5.5 0 10-3.4 11-8.5-5.6-.4-10 2.7-11 8.5Z" fill="#5C9A4F"/>

  <!-- soil line -->
  <path d="M17 45c5-2.4 10-2.4 15 0s10 2.4 15 0" fill="none" stroke="#6B4A2B" stroke-width="2.6" stroke-linecap="round"/>
</svg>
